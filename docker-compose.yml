services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000

  simulator:
    build:
      context: ./simulator
    profiles: ["tools"]
    depends_on:
      - backend
    command: ["--api-url", "http://backend:8000"]
